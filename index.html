<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zuzarts</title>
  <style>
    :root {
      --pastel-purple-1: #EBDCFD;
      --pastel-purple-2: #D6B8FF;
      --logo-box-bg: rgba(255,255,255,0.85);
      --logo-box-border: rgba(0,0,0,0.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;background:#fff;color:#111}

    .header {
      background: linear-gradient(135deg,var(--pastel-purple-1),var(--pastel-purple-2));
      padding: clamp(20px,6vh,48px) 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:12px;
    }

    .logo-box{
      background:var(--logo-box-bg);
      border:1px solid var(--logo-box-border);
      padding:12px;
      border-radius:12px;
      box-shadow:0 6px 20px rgba(0,0,0,0.08);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .logo-box img{
      display:block;
      max-height:120px;
      width:auto;
      height:auto;
    }

    .site-title{
      margin:0;
      font-weight:600;
      color:#2b1b3a;
      letter-spacing:0.2px;
      font-size:clamp(1rem,2.5vw,1.25rem);
    }

    @media (max-width:480px){
      .logo-box{padding:8px;border-radius:10px}
      .logo-box img{max-height:80px}
    }
  </style>
</head>
<body>
  <header class="header" role="banner">
    <div class="logo-box">
      <img src="zuzarts.png" alt="Zuzarts logo">
    </div>
    <h1 class="site-title">Zuzarts</h1>
  </header>
  <main>
    <!-- Page content goes here -->
  </main>
</body>
</html>
